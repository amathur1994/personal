<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; overflow: hidden; }

  @keyframes checkPop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.25); }
    70%  { transform: scale(0.9); }
    100% { transform: scale(1); }
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes modalIn {
    from { opacity: 0; transform: translateY(30px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes progressFill {
    from { width: 0%; }
  }
  .anim-slidein { animation: slideIn 0.35s cubic-bezier(.22,.68,0,1.2) both; }
  .anim-fadein  { animation: fadeIn 0.25s ease both; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { border-radius: 99px; }
</style>
</head>

<div id="root"></div>

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function progress(tasks) {
  if (!tasks.length) return 0;
  return Math.round((tasks.filter(t => t.done).length / tasks.length) * 100);
}

function formatDate(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}

function isOverdue(dateStr) {
  if (!dateStr) return false;
  return new Date(dateStr) < new Date(new Date().toDateString());
}

// ─── ICONS (inline SVG) ──────────────────────────────────────────────────────

// ─── CHECKBOX ────────────────────────────────────────────────────────────────
function Checkbox({ checked, onChange, theme, accent }) {
  const [pop, setPop] = useState(false);
  const handle = () => {
    if (!checked) { setPop(true); setTimeout(() => setPop(false), 400); }
    onChange(!checked);
  };
  const accentColor = accent || theme.accent;
  return (
    <button onClick={handle} style={{
      width: 22, height: 22, borderRadius: 6,
      border: `2px solid ${checked ? accentColor : theme.borderStrong}`,
      background: checked ? accentColor : 'transparent',
      cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0, transition: 'all 0.2s ease',
      animation: pop ? 'checkPop 0.35s ease' : 'none',
      outline: 'none',
    }}>
      {checked && <Icon name="check" size={13} color="#fff" strokeWidth={2.5} />}
    </button>
  );
}

// ─── PROGRESS BAR ────────────────────────────────────────────────────────────
function ProgressBar({ pct, theme, accent, height = 6, animate = true }) {
  const accentColor = accent || theme.accent;
  return (
    <div style={{ background: theme.bgDeep, borderRadius: 99, height, overflow: 'hidden', width: '100%' }}>
      <div style={{
        height: '100%', borderRadius: 99,
        background: `linear-gradient(90deg, ${accentColor}CC, ${accentColor})`,
        width: `${pct}%`,
        transition: animate ? 'width 0.6s cubic-bezier(.22,.68,0,1.1)' : 'none',
        animation: animate ? 'progressFill 0.8s cubic-bezier(.22,.68,0,1.1)' : 'none',
      }} />
    </div>
  );
}

// ─── PRIORITY BADGE ──────────────────────────────────────────────────────────
function PriorityBadge({ priority, theme }) {
  const colors = { high: theme.priorityHigh, med: theme.priorityMed, low: theme.priorityLow };
  const color = colors[priority] || theme.textSoft;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 4,
      fontSize: 11, fontWeight: 600, color, letterSpacing: '0.03em',
      background: color + '18', borderRadius: 99, padding: '2px 8px',
    }}>
      <span style={{ width: 5, height: 5, borderRadius: '50%', background: color, display: 'inline-block' }} />
      {PRIORITY_LABELS[priority]}
    </span>
  );
}

// ─── HOME SCREEN ─────────────────────────────────────────────────────────────
function HomeScreen({ lists, theme, onOpen, onNew, onDelete, onRename, onReorder }) {
  const [dragId, setDragId] = useState(null);
  const [dragOverId, setDragOverId] = useState(null);

  const handleDragStart = (id) => setDragId(id);
  const handleDragOver = (id) => { if (id !== dragId) setDragOverId(id); };
  const handleDrop = (id) => {
    if (dragId && id !== dragId) onReorder(dragId, id);
    setDragId(null);
    setDragOverId(null);
  };
  const handleDragEnd = () => { setDragId(null); setDragOverId(null); };

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: theme.bg }}>
      {/* Header */}
      <div style={{ padding: '40px 40px 0', flexShrink: 0 }}>
        <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between' }}>
          <div>
            <p style={{ fontSize: 13, fontWeight: 500, color: theme.textSoft, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 6 }}>
              {new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' })}
            </p>
            <h1 style={{ fontFamily: 'Playfair Display, serif', fontSize: 38, fontWeight: 700, color: theme.text, lineHeight: 1.1 }}>
              Akhil's To-Dos
            </h1>
          </div>
          <button onClick={onNew} style={{
            display: 'flex', alignItems: 'center', gap: 8,
            background: theme.accent, color: '#fff',
            border: 'none', borderRadius: 12, padding: '11px 20px',
            fontFamily: 'DM Sans, sans-serif', fontSize: 14, fontWeight: 600,
            cursor: 'pointer', boxShadow: `0 4px 16px ${theme.accent}40`,
            transition: 'transform 0.15s, box-shadow 0.15s',
          }}
          onMouseEnter={e => { e.currentTarget.style.transform = 'translateY(-1px)'; e.currentTarget.style.boxShadow = `0 6px 20px ${theme.accent}55`; }}
          onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = `0 4px 16px ${theme.accent}40`; }}>
            <Icon name="plus" size={16} color="#fff" strokeWidth={2.5} />
            New Checklist
          </button>
        </div>

        {/* Summary bar */}
        <div style={{ display: 'flex', gap: 24, marginTop: 28, paddingBottom: 28, borderBottom: `1px solid ${theme.border}` }}>
          {[
            { label: 'Checklists', val: lists.length },
            { label: 'Total tasks', val: lists.reduce((s,l)=>s+l.tasks.length,0) },
            { label: 'Completed', val: lists.reduce((s,l)=>s+l.tasks.filter(t=>t.done).length,0) },
          ].map(({label,val}) => (
            <div key={label}>
              <div style={{ fontFamily:'Playfair Display, serif', fontSize:26, fontWeight:700, color:theme.text }}>{val}</div>
              <div style={{ fontSize:12, color:theme.textSoft, fontWeight:500, marginTop:1 }}>{label}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Grid */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '28px 40px 40px' }}>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(280px, 1fr))', gap: 18 }}>
          {lists.map((list, i) => (
            <ListCard key={list.id} list={list} theme={theme} delay={i*60}
              onOpen={() => onOpen(list.id)} onDelete={() => onDelete(list.id)}
              onRename={newTitle => onRename(list.id, newTitle)}
              dragging={dragId === list.id}
              dragOver={dragOverId === list.id}
              onDragStart={() => handleDragStart(list.id)}
              onDragOver={() => handleDragOver(list.id)}
              onDrop={() => handleDrop(list.id)}
              onDragEnd={handleDragEnd} />
          ))}
          {/* Add card */}
          <button onClick={onNew} style={{
            background: 'transparent', border: `2px dashed ${theme.borderStrong}`,
            borderRadius: 18, minHeight: 160, cursor: 'pointer',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 10,
            color: theme.textSoft, transition: 'all 0.2s', fontFamily: 'DM Sans, sans-serif',
          }}
          onMouseEnter={e => { e.currentTarget.style.background = theme.accentSoft; e.currentTarget.style.borderColor = theme.accent; e.currentTarget.style.color = theme.accent; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.borderColor = theme.borderStrong; e.currentTarget.style.color = theme.textSoft; }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', border: `2px solid currentColor`, display:'flex',alignItems:'center',justifyContent:'center' }}>
              <Icon name="plus" size={18} color="currentColor" strokeWidth={2} />
            </div>
            <span style={{ fontSize: 14, fontWeight: 500 }}>New checklist</span>
          </button>
        </div>
      </div>
    </div>
  );
}

function ListCard({ list, theme, delay, onOpen, onDelete, onRename, dragging, dragOver, onDragStart, onDragOver, onDrop, onDragEnd }) {
  const pct = progress(list.tasks);
  const done = list.tasks.filter(t => t.done).length;
  const color = theme.cardColors[list.colorIdx % theme.cardColors.length];
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(list.title);
  const renameRef = useRef();
  useEffect(() => { if (editing) renameRef.current?.focus(); }, [editing]);

  const commitRename = () => {
    const trimmed = draft.trim();
    if (trimmed && trimmed !== list.title) onRename(trimmed);
    else setDraft(list.title);
    setEditing(false);
  };

  return (
    <div
      className="anim-slidein"
      draggable
      onDragStart={e => { e.dataTransfer.effectAllowed = 'move'; onDragStart(); }}
      onDragOver={e => { e.preventDefault(); onDragOver(); }}
      onDrop={e => { e.preventDefault(); onDrop(); }}
      onDragEnd={onDragEnd}
      style={{
        animationDelay: `${delay}ms`, background: theme.surface,
        border: `2px solid ${dragOver ? theme.accent : theme.border}`,
        borderRadius: 18, boxShadow: dragOver ? `0 0 0 3px ${theme.accent}30` : `0 2px 12px ${theme.shadow}`,
        overflow: 'hidden', cursor: dragging ? 'grabbing' : 'grab',
        transition: 'transform 0.18s, box-shadow 0.18s, border-color 0.15s, opacity 0.15s',
        opacity: dragging ? 0.45 : 1,
      }}
    onMouseEnter={e => { if (!editing && !dragging) { e.currentTarget.style.transform = 'translateY(-3px)'; e.currentTarget.style.boxShadow = `0 8px 28px ${theme.shadowMd}`; } }}
    onMouseLeave={e => { e.currentTarget.style.transform = ''; e.currentTarget.style.boxShadow = dragOver ? `0 0 0 3px ${theme.accent}30` : `0 2px 12px ${theme.shadow}`; }}>
      {/* Color strip */}
      <div style={{ height: 5, background: color }} />
      <div style={{ padding: '20px 20px 18px' }} onClick={editing || dragging ? undefined : onOpen}>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 14 }}>
          {editing ? (
            <input ref={renameRef} value={draft} onChange={e => setDraft(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') commitRename(); if (e.key === 'Escape') { setDraft(list.title); setEditing(false); } }}
              onBlur={commitRename}
              onClick={e => e.stopPropagation()}
              style={{
                flex: 1, fontFamily: 'Playfair Display, serif', fontSize: 20, fontWeight: 600,
                color: theme.text, background: theme.bgDeep, border: `1.5px solid ${theme.accent}`,
                borderRadius: 8, padding: '2px 8px', outline: 'none', lineHeight: 1.2,
              }} />
          ) : (
            <h2 style={{ fontFamily: 'Playfair Display, serif', fontSize: 20, fontWeight: 600, color: theme.text, lineHeight: 1.2, flex: 1 }}>
              {list.title}
            </h2>
          )}
          <div style={{ display: 'flex', gap: 2, flexShrink: 0, marginLeft: 8 }}>
            <button onClick={e => { e.stopPropagation(); setDraft(list.title); setEditing(true); }} style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: 4,
              color: theme.textSoft, borderRadius: 6, transition: 'color 0.15s',
            }}
            onMouseEnter={e => e.currentTarget.style.color = theme.accent}
            onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
              <Icon name="pencil" size={14} />
            </button>
            <button onClick={e => { e.stopPropagation(); onDelete(); }} style={{
              background: 'none', border: 'none', cursor: 'pointer', padding: 4,
              color: theme.textSoft, borderRadius: 6, transition: 'color 0.15s',
            }}
            onMouseEnter={e => e.currentTarget.style.color = theme.priorityHigh}
            onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
              <Icon name="trash" size={14} />
            </button>
          </div>
        </div>

        <div style={{ marginBottom: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 7 }}>
            <span style={{ fontSize: 12, color: theme.textSoft, fontWeight: 500 }}>{done} of {list.tasks.length} tasks</span>
            <span style={{ fontSize: 13, fontWeight: 700, color: pct === 100 ? theme.priorityLow : theme.accent }}>{pct}%</span>
          </div>
          <ProgressBar pct={pct} theme={theme} accent={color} />
        </div>

        <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {list.tasks.slice(0,3).map(t => (
            <span key={t.id} style={{
              fontSize: 11, color: t.done ? theme.textSoft : theme.textMid,
              background: theme.bgDeep, borderRadius: 6, padding: '3px 8px',
              textDecoration: t.done ? 'line-through' : 'none',
              maxWidth: 120, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap',
            }}>{t.text}</span>
          ))}
          {list.tasks.length > 3 && (
            <span style={{ fontSize: 11, color: theme.textSoft, background: theme.bgDeep, borderRadius: 6, padding: '3px 8px' }}>
              +{list.tasks.length - 3} more
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── CREATE MODAL ─────────────────────────────────────────────────────────────
function CreateModal({ theme, onClose, onCreate }) {
  const [title, setTitle] = useState('');
  const [colorIdx, setColorIdx] = useState(0);
  const inputRef = useRef();
  useEffect(() => { setTimeout(() => inputRef.current?.focus(), 100); }, []);

  const submit = () => {
    if (!title.trim()) return;
    onCreate({ title: title.trim(), colorIdx });
    onClose();
  };

  return (
    <div style={{
      position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.35)', backdropFilter: 'blur(4px)',
      display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 100,
    }} onClick={e => { if (e.target === e.currentTarget) onClose(); }} className="anim-fadein">
      <div style={{
        background: theme.surface, borderRadius: 24, padding: 36, width: 440,
        boxShadow: `0 24px 64px ${theme.shadowMd}`, animation: 'modalIn 0.3s cubic-bezier(.22,.68,0,1.1)',
      }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 28 }}>
          <h2 style={{ fontFamily: 'Playfair Display, serif', fontSize: 24, fontWeight: 700, color: theme.text }}>New Checklist</h2>
          <button onClick={onClose} style={{ background: 'none', border: 'none', cursor: 'pointer', color: theme.textSoft, borderRadius: 8, padding: 4 }}>
            <Icon name="x" size={20} />
          </button>
        </div>

        <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: theme.textSoft, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 8 }}>Title</label>
        <input ref={inputRef} value={title} onChange={e => setTitle(e.target.value)}
          onKeyDown={e => e.key === 'Enter' && submit()}
          placeholder="e.g. Weekend errands…"
          style={{
            width: '100%', padding: '12px 16px', borderRadius: 12,
            border: `1.5px solid ${theme.borderStrong}`, background: theme.bg,
            fontFamily: 'DM Sans, sans-serif', fontSize: 16, color: theme.text,
            outline: 'none', marginBottom: 24, transition: 'border-color 0.2s',
          }}
          onFocus={e => e.target.style.borderColor = theme.accent}
          onBlur={e => e.target.style.borderColor = theme.borderStrong} />

        <label style={{ display: 'block', fontSize: 12, fontWeight: 600, color: theme.textSoft, letterSpacing: '0.06em', textTransform: 'uppercase', marginBottom: 12 }}>Colour</label>
        <div style={{ display: 'flex', gap: 10, marginBottom: 32 }}>
          {theme.cardColors.map((c, i) => (
            <button key={i} onClick={() => setColorIdx(i)} style={{
              width: 30, height: 30, borderRadius: '50%', background: c, border: 'none', cursor: 'pointer',
              boxShadow: colorIdx === i ? `0 0 0 3px ${theme.surface}, 0 0 0 5px ${c}` : 'none',
              transition: 'box-shadow 0.18s',
            }} />
          ))}
        </div>

        <div style={{ display: 'flex', gap: 12 }}>
          <button onClick={onClose} style={{
            flex: 1, padding: '12px', borderRadius: 12, border: `1.5px solid ${theme.borderStrong}`,
            background: 'transparent', color: theme.textMid, fontFamily: 'DM Sans, sans-serif',
            fontSize: 15, fontWeight: 500, cursor: 'pointer',
          }}>Cancel</button>
          <button onClick={submit} style={{
            flex: 2, padding: '12px', borderRadius: 12, border: 'none',
            background: theme.accent, color: '#fff', fontFamily: 'DM Sans, sans-serif',
            fontSize: 15, fontWeight: 600, cursor: 'pointer',
            boxShadow: `0 4px 16px ${theme.accent}40`, opacity: title.trim() ? 1 : 0.5,
          }}>Create Checklist</button>
        </div>
      </div>
    </div>
  );
}

// ─── DETAIL SCREEN ───────────────────────────────────────────────────────────
function DetailScreen({ list, theme, onChange, onBack }) {
  const [newTask, setNewTask] = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const [addingSubtask, setAddingSubtask] = useState(null);
  const [newSubtask, setNewSubtask] = useState('');
  const [editingTitle, setEditingTitle] = useState(false);
  const [titleDraft, setTitleDraft] = useState(list.title);
  const inputRef = useRef();
  const titleRef = useRef();
  const pct = progress(list.tasks);
  const color = theme.cardColors[list.colorIdx % theme.cardColors.length];

  useEffect(() => { if (editingTitle) titleRef.current?.focus(); }, [editingTitle]);

  const commitTitle = () => {
    const trimmed = titleDraft.trim();
    if (trimmed) onChange({ ...list, title: trimmed });
    else setTitleDraft(list.title);
    setEditingTitle(false);
  };

  const updateTask = (taskId, patch) => {
    onChange({ ...list, tasks: list.tasks.map(t => t.id === taskId ? { ...t, ...patch } : t) });
  };
  const updateSubtask = (taskId, subId, patch) => {
    onChange({ ...list, tasks: list.tasks.map(t => t.id === taskId ? { ...t, subtasks: t.subtasks.map(s => s.id === subId ? { ...s, ...patch } : s) } : t) });
  };
  const addTask = () => {
    if (!newTask.trim()) return;
    onChange({ ...list, tasks: [...list.tasks, { id: makeId(), text: newTask.trim(), done: false, priority: 'med', dueDate: '', notes: '', subtasks: [] }] });
    setNewTask('');
  };
  const deleteTask = (taskId) => {
    onChange({ ...list, tasks: list.tasks.filter(t => t.id !== taskId) });
  };
  const addSubtask = (taskId) => {
    if (!newSubtask.trim()) return;
    const sub = { id: makeId(), text: newSubtask.trim(), done: false };
    onChange({ ...list, tasks: list.tasks.map(t => t.id === taskId ? { ...t, subtasks: [...t.subtasks, sub] } : t) });
    setNewSubtask('');
    setAddingSubtask(null);
  };

  const done = list.tasks.filter(t => t.done).length;

  return (
    <div style={{ height: '100%', display: 'flex', flexDirection: 'column', background: theme.bg }}>
      {/* Header */}
      <div style={{ background: theme.surface, borderBottom: `1px solid ${theme.border}`, flexShrink: 0, padding: '28px 40px 24px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, marginBottom: 20 }}>
          <button onClick={onBack} style={{
            background: theme.bgDeep, border: 'none', borderRadius: 10, padding: '8px 10px',
            cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 4, color: theme.textMid,
            fontFamily: 'DM Sans, sans-serif', fontSize: 13, fontWeight: 500, transition: 'background 0.15s',
          }}
          onMouseEnter={e => e.currentTarget.style.background = theme.border}
          onMouseLeave={e => e.currentTarget.style.background = theme.bgDeep}>
            <Icon name="chevronLeft" size={16} /> Back
          </button>
          <div style={{ width: 12, height: 12, borderRadius: '50%', background: color, flexShrink: 0 }} />
          {editingTitle ? (
            <input ref={titleRef} value={titleDraft} onChange={e => setTitleDraft(e.target.value)}
              onKeyDown={e => { if (e.key === 'Enter') commitTitle(); if (e.key === 'Escape') { setTitleDraft(list.title); setEditingTitle(false); } }}
              onBlur={commitTitle}
              style={{
                fontFamily: 'Playfair Display, serif', fontSize: 28, fontWeight: 700,
                color: theme.text, background: theme.bgDeep, border: `1.5px solid ${theme.accent}`,
                borderRadius: 10, padding: '2px 12px', outline: 'none', flex: 1,
              }} />
          ) : (
            <h1 style={{ fontFamily: 'Playfair Display, serif', fontSize: 28, fontWeight: 700, color: theme.text }}>
              {list.title}
            </h1>
          )}
          <button onClick={() => { setTitleDraft(list.title); setEditingTitle(true); }} style={{
            background: 'none', border: 'none', cursor: 'pointer', padding: 4, marginLeft: 4,
            color: theme.textSoft, borderRadius: 6, transition: 'color 0.15s', flexShrink: 0,
          }}
          onMouseEnter={e => e.currentTarget.style.color = theme.accent}
          onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
            <Icon name="pencil" size={16} />
          </button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <div style={{ flex: 1 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
              <span style={{ fontSize: 13, color: theme.textSoft, fontWeight: 500 }}>{done} of {list.tasks.length} tasks complete</span>
              <span style={{ fontSize: 14, fontWeight: 700, color: pct === 100 ? theme.priorityLow : theme.accent }}>{pct}%</span>
            </div>
            <ProgressBar pct={pct} theme={theme} accent={color} height={8} />
          </div>
        </div>
        {pct === 100 && list.tasks.length > 0 && (
          <div style={{
            marginTop: 14, background: theme.priorityLow + '18', border: `1px solid ${theme.priorityLow}40`,
            borderRadius: 10, padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 8,
          }}>
            <Icon name="check" size={15} color={theme.priorityLow} strokeWidth={2.5} />
            <span style={{ fontSize: 13, fontWeight: 600, color: theme.priorityLow }}>All done — great work!</span>
          </div>
        )}
      </div>

      {/* Task list */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '24px 40px' }}>
        {list.tasks.length === 0 && (
          <div style={{ textAlign: 'center', padding: '60px 0', color: theme.textSoft }}>
            <Icon name="list" size={40} color={theme.border} />
            <p style={{ marginTop: 16, fontSize: 15 }}>No tasks yet. Add one below.</p>
          </div>
        )}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          {list.tasks.map((task, i) => (
            <TaskRow key={task.id} task={task} theme={theme} color={color} delay={i * 40}
              expanded={expandedId === task.id}
              onToggle={() => setExpandedId(expandedId === task.id ? null : task.id)}
              onCheck={done => updateTask(task.id, { done })}
              onUpdate={patch => updateTask(task.id, patch)}
              onDelete={() => deleteTask(task.id)}
              onSubCheck={(subId, done) => updateSubtask(task.id, subId, { done })}
              addingSubtask={addingSubtask === task.id}
              newSubtask={newSubtask}
              onNewSubtaskChange={setNewSubtask}
              onAddSubtaskStart={() => { setAddingSubtask(task.id); setNewSubtask(''); }}
              onAddSubtask={() => addSubtask(task.id)}
              onCancelSubtask={() => setAddingSubtask(null)}
            />
          ))}
        </div>
      </div>

      {/* Add task bar */}
      <div style={{ borderTop: `1px solid ${theme.border}`, background: theme.surface, padding: '16px 40px', flexShrink: 0 }}>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <div style={{ width: 22, height: 22, borderRadius: 6, border: `2px solid ${theme.borderStrong}`, display:'flex',alignItems:'center',justifyContent:'center', flexShrink:0 }}>
            <Icon name="plus" size={12} color={theme.textSoft} strokeWidth={2.5} />
          </div>
          <input ref={inputRef} value={newTask} onChange={e => setNewTask(e.target.value)}
            onKeyDown={e => e.key === 'Enter' && addTask()}
            placeholder="Add a task…"
            style={{
              flex: 1, background: 'none', border: 'none', outline: 'none',
              fontFamily: 'DM Sans, sans-serif', fontSize: 15, color: theme.text,
            }} />
          <button onClick={addTask} style={{
            background: newTask.trim() ? theme.accent : theme.bgDeep,
            color: newTask.trim() ? '#fff' : theme.textSoft,
            border: 'none', borderRadius: 9, padding: '8px 16px',
            fontFamily: 'DM Sans, sans-serif', fontSize: 13, fontWeight: 600,
            cursor: newTask.trim() ? 'pointer' : 'default', transition: 'all 0.2s',
          }}>Add</button>
        </div>
      </div>
    </div>
  );
}

function TaskRow({ task, theme, color, delay, expanded, onToggle, onCheck, onUpdate, onDelete, onSubCheck, addingSubtask, newSubtask, onNewSubtaskChange, onAddSubtaskStart, onAddSubtask, onCancelSubtask }) {
  const subtaskPct = task.subtasks.length ? Math.round(task.subtasks.filter(s=>s.done).length/task.subtasks.length*100) : 0;
  const [editingText, setEditingText] = useState(false);
  const [textDraft, setTextDraft] = useState(task.text);
  const textRef = useRef();
  useEffect(() => { if (editingText) textRef.current?.focus(); }, [editingText]);

  const commitText = () => {
    const trimmed = textDraft.trim();
    if (trimmed && trimmed !== task.text) onUpdate({ text: trimmed });
    else setTextDraft(task.text);
    setEditingText(false);
  };

  return (
    <div className="anim-slidein" style={{ animationDelay: `${delay}ms`, background: theme.surface,
      border: `1px solid ${expanded ? theme.borderStrong : theme.border}`,
      borderRadius: 14, overflow: 'hidden', transition: 'border-color 0.2s',
      opacity: task.done ? 0.75 : 1,
    }}>
      {/* Main row */}
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, padding: '14px 16px', cursor: 'pointer' }}
        onClick={editingText ? undefined : onToggle}>
        <div onClick={e => e.stopPropagation()}>
          <Checkbox checked={task.done} onChange={onCheck} theme={theme} accent={color} />
        </div>
        {editingText ? (
          <input ref={textRef} value={textDraft} onChange={e => setTextDraft(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter') commitText(); if (e.key === 'Escape') { setTextDraft(task.text); setEditingText(false); } }}
            onBlur={commitText}
            onClick={e => e.stopPropagation()}
            style={{
              flex: 1, fontFamily: 'DM Sans, sans-serif', fontSize: 15, fontWeight: 500,
              color: theme.text, background: theme.bgDeep, border: `1.5px solid ${theme.accent}`,
              borderRadius: 7, padding: '3px 10px', outline: 'none',
            }} />
        ) : (
          <span style={{ flex: 1, fontSize: 15, fontWeight: 500, color: theme.text, textDecoration: task.done ? 'line-through' : 'none', transition: 'all 0.2s', lineHeight: 1.4 }}>
            {task.text}
          </span>
        )}
        <div style={{ display: 'flex', gap: 8, alignItems: 'center', flexShrink: 0 }}>
          <button onClick={e => { e.stopPropagation(); setTextDraft(task.text); setEditingText(true); }} style={{
            background: 'none', border: 'none', cursor: 'pointer', padding: 3,
            color: theme.textSoft, borderRadius: 5, transition: 'color 0.15s', display: 'flex',
          }}
          onMouseEnter={e => e.currentTarget.style.color = theme.accent}
          onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
            <Icon name="pencil" size={13} />
          </button>
          {task.dueDate && (
            <span style={{ fontSize: 11, fontWeight: 600, color: isOverdue(task.dueDate) ? theme.priorityHigh : theme.textSoft,
              display: 'flex', alignItems: 'center', gap: 4 }}>
              <Icon name="calendar" size={11} />
              {formatDate(task.dueDate)}
            </span>
          )}
          {task.subtasks.length > 0 && (
            <span style={{ fontSize: 11, color: theme.textSoft, fontWeight: 500 }}>
              {task.subtasks.filter(s=>s.done).length}/{task.subtasks.length}
            </span>
          )}
          <PriorityBadge priority={task.priority} theme={theme} />
          <Icon name={expanded ? 'chevronDown' : 'chevronRight'} size={14} color={theme.textSoft} />
        </div>
      </div>

      {/* Subtask mini-bar */}
      {task.subtasks.length > 0 && !expanded && (
        <div style={{ padding: '0 16px 12px', paddingLeft: 50 }}>
          <ProgressBar pct={subtaskPct} theme={theme} accent={color} height={3} animate={false} />
        </div>
      )}

      {/* Expanded panel */}
      {expanded && (
        <div style={{ borderTop: `1px solid ${theme.border}`, padding: '16px 16px 16px 50px', background: theme.bg + '80' }}>
          {/* Priority & date row */}
          <div style={{ display: 'flex', gap: 12, marginBottom: 16, flexWrap: 'wrap' }}>
            <div>
              <label style={{ display: 'block', fontSize: 11, color: theme.textSoft, fontWeight: 600, letterSpacing:'0.05em', textTransform:'uppercase', marginBottom: 6 }}>Priority</label>
              <div style={{ display: 'flex', gap: 6 }}>
                {['high','med','low'].map(p => {
                  const colors = { high: theme.priorityHigh, med: theme.priorityMed, low: theme.priorityLow };
                  const isActive = task.priority === p;
                  return (
                    <button key={p} onClick={() => onUpdate({ priority: p })} style={{
                      fontSize: 12, fontWeight: 600, padding: '4px 10px', borderRadius: 99, cursor: 'pointer',
                      border: `1.5px solid ${colors[p]}`,
                      background: isActive ? colors[p] : 'transparent',
                      color: isActive ? '#fff' : colors[p], transition: 'all 0.15s',
                    }}>{PRIORITY_LABELS[p]}</button>
                  );
                })}
              </div>
            </div>
            <div>
              <label style={{ display: 'block', fontSize: 11, color: theme.textSoft, fontWeight: 600, letterSpacing:'0.05em', textTransform:'uppercase', marginBottom: 6 }}>Due date</label>
              <input type="date" value={task.dueDate} onChange={e => onUpdate({ dueDate: e.target.value })}
                style={{ padding: '5px 10px', borderRadius: 8, border: `1.5px solid ${theme.borderStrong}`, background: theme.surface,
                  fontFamily: 'DM Sans, sans-serif', fontSize: 12, color: theme.text, outline: 'none', cursor: 'pointer' }} />
            </div>
          </div>

          {/* Notes */}
          <div style={{ marginBottom: 16 }}>
            <label style={{ display: 'block', fontSize: 11, color: theme.textSoft, fontWeight: 600, letterSpacing:'0.05em', textTransform:'uppercase', marginBottom: 6 }}>Notes</label>
            <textarea value={task.notes} onChange={e => onUpdate({ notes: e.target.value })}
              placeholder="Add a note…"
              style={{ width: '100%', minHeight: 60, padding: '10px 12px', borderRadius: 10,
                border: `1.5px solid ${theme.border}`, background: theme.surface,
                fontFamily: 'DM Sans, sans-serif', fontSize: 13, color: theme.text,
                resize: 'vertical', outline: 'none', lineHeight: 1.5, transition: 'border-color 0.2s',
              }}
              onFocus={e => e.target.style.borderColor = theme.accent}
              onBlur={e => e.target.style.borderColor = theme.border} />
          </div>

          {/* Subtasks */}
          <div style={{ marginBottom: 8 }}>
            <label style={{ display: 'block', fontSize: 11, color: theme.textSoft, fontWeight: 600, letterSpacing:'0.05em', textTransform:'uppercase', marginBottom: 8 }}>
              Subtasks {task.subtasks.length > 0 && `· ${task.subtasks.filter(s=>s.done).length}/${task.subtasks.length}`}
            </label>
            {task.subtasks.length > 0 && (
              <div style={{ marginBottom: 8 }}>
                <ProgressBar pct={subtaskPct} theme={theme} accent={color} height={4} />
              </div>
            )}
            <div style={{ display: 'flex', flexDirection: 'column', gap: 7 }}>
              {task.subtasks.map(sub => (
                <div key={sub.id} style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                  <Checkbox checked={sub.done} onChange={done => onSubCheck(sub.id, done)} theme={theme} accent={color} />
                  <span style={{ fontSize: 13, color: sub.done ? theme.textSoft : theme.text, textDecoration: sub.done ? 'line-through' : 'none', flex: 1 }}>
                    {sub.text}
                  </span>
                </div>
              ))}
            </div>
            {addingSubtask ? (
              <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                <input autoFocus value={newSubtask} onChange={e => onNewSubtaskChange(e.target.value)}
                  onKeyDown={e => { if (e.key === 'Enter') onAddSubtask(); if (e.key === 'Escape') onCancelSubtask(); }}
                  placeholder="Subtask name…"
                  style={{ flex: 1, padding: '7px 11px', borderRadius: 8, border: `1.5px solid ${theme.accent}`,
                    background: theme.surface, fontFamily: 'DM Sans', fontSize: 13, color: theme.text, outline: 'none' }} />
                <button onClick={onAddSubtask} style={{ padding: '7px 12px', borderRadius: 8, background: theme.accent, color: '#fff', border: 'none', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>Add</button>
                <button onClick={onCancelSubtask} style={{ padding: '7px 10px', borderRadius: 8, background: 'none', border: `1.5px solid ${theme.borderStrong}`, color: theme.textMid, cursor: 'pointer' }}>✕</button>
              </div>
            ) : (
              <button onClick={onAddSubtaskStart} style={{
                marginTop: 8, display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none',
                color: theme.textSoft, fontSize: 12, fontWeight: 500, cursor: 'pointer', padding: '4px 0',
                fontFamily: 'DM Sans',
              }}
              onMouseEnter={e => e.currentTarget.style.color = theme.accent}
              onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
                <Icon name="plus" size={13} /> Add subtask
              </button>
            )}
          </div>

          {/* Delete task */}
          <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 4 }}>
            <button onClick={onDelete} style={{
              display: 'flex', alignItems: 'center', gap: 5, background: 'none', border: 'none',
              color: theme.textSoft, fontSize: 12, fontWeight: 500, cursor: 'pointer',
              fontFamily: 'DM Sans', padding: '4px 0', transition: 'color 0.15s',
            }}
            onMouseEnter={e => e.currentTarget.style.color = theme.priorityHigh}
            onMouseLeave={e => e.currentTarget.style.color = theme.textSoft}>
              <Icon name="trash" size={13} /> Delete task
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── TWEAKS PANEL ────────────────────────────────────────────────────────────
function TweaksPanel({ visible, themeKey, onTheme }) {
  if (!visible) return null;
  return (
    <div style={{
      position: 'fixed', bottom: 80, right: 24, zIndex: 200,
      background: THEMES.linen.surface, border: `1px solid ${THEMES.linen.border}`,
      borderRadius: 18, padding: 22, width: 240,
      boxShadow: '0 12px 40px rgba(100,60,20,0.18)',
      fontFamily: 'DM Sans, sans-serif', animation: 'modalIn 0.25s ease',
    }}>
      <h3 style={{ fontSize: 13, fontWeight: 700, letterSpacing:'0.06em', textTransform:'uppercase', color: THEMES.linen.textSoft, marginBottom: 14 }}>
        Tweaks
      </h3>
      <p style={{ fontSize: 12, color: THEMES.linen.textSoft, marginBottom: 12, fontWeight: 500 }}>Theme</p>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
        {Object.entries(THEMES).map(([key, t]) => (
          <button key={key} onClick={() => onTheme(key)} style={{
            display: 'flex', alignItems: 'center', gap: 10, padding: '10px 12px', borderRadius: 10,
            border: `1.5px solid ${themeKey === key ? t.accent : THEMES.linen.border}`,
            background: themeKey === key ? t.accentSoft : 'transparent',
            cursor: 'pointer', width: '100%', textAlign: 'left', transition: 'all 0.18s',
          }}>
            <div style={{ width: 18, height: 18, borderRadius: '50%', background: t.accent, flexShrink: 0 }} />
            <span style={{ fontSize: 13, fontWeight: themeKey === key ? 700 : 500, color: THEMES.linen.text }}>{t.name}</span>
            {themeKey === key && <Icon name="check" size={13} color={t.accent} strokeWidth={2.5} />}
          </button>
        ))}
      </div>
    </div>
  );
}

// ─── APP ROOT ────────────────────────────────────────────────────────────────
function App() {
  const [themeKey, setThemeKey] = useState(() => localStorage.getItem('cl_theme') || 'linen');
  const [lists, setLists] = useState(() => {
    try { const s = localStorage.getItem('cl_lists'); return s ? JSON.parse(s) : INITIAL_LISTS; } catch { return INITIAL_LISTS; }
  });
  const [activeId, setActiveId] = useState(() => localStorage.getItem('cl_activeId') || null);
  const [showCreate, setShowCreate] = useState(false);
  const [tweaksVisible, setTweaksVisible] = useState(false);

  const theme = THEMES[themeKey] || THEMES.linen;

  useEffect(() => { localStorage.setItem('cl_lists', JSON.stringify(lists)); }, [lists]);
  useEffect(() => { localStorage.setItem('cl_activeId', activeId || ''); }, [activeId]);
  useEffect(() => { localStorage.setItem('cl_theme', themeKey); }, [themeKey]);

  const activeList = lists.find(l => l.id === activeId);

  const handleCreate = ({ title, colorIdx }) => {
    const newList = { id: makeId(), title, colorIdx, tasks: [] };
    setLists(prev => [...prev, newList]);
    setActiveId(newList.id);
  };

  const handleUpdate = (updated) => {
    setLists(prev => prev.map(l => l.id === updated.id ? updated : l));
  };

  const handleDelete = (id) => {
    setLists(prev => prev.filter(l => l.id !== id));
    if (activeId === id) setActiveId(null);
  };

  const handleRename = (id, newTitle) => {
    setLists(prev => prev.map(l => l.id === id ? { ...l, title: newTitle } : l));
  };

  const handleReorder = (dragId, dropId) => {
    setLists(prev => {
      const arr = [...prev];
      const from = arr.findIndex(l => l.id === dragId);
      const to = arr.findIndex(l => l.id === dropId);
      if (from === -1 || to === -1) return prev;
      const [item] = arr.splice(from, 1);
      arr.splice(to, 0, item);
      return arr;
    });
  };

  // Listen for tweaks toggle from host
  useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleThemeChange = (key) => {
    setThemeKey(key);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { theme: key } }, '*');
  };

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: theme.bg }}>
      {/* Top bar */}
      <div style={{ height: 52, background: theme.surface, borderBottom: `1px solid ${theme.border}`,
        display: 'flex', alignItems: 'center', paddingInline: 40, gap: 12, flexShrink: 0,
        boxShadow: `0 1px 0 ${theme.border}`,
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, flex: 1 }}>
          <div style={{ width: 22, height: 22, borderRadius: 6, background: theme.accent, display:'flex',alignItems:'center',justifyContent:'center' }}>
            <Icon name="check" size={13} color="#fff" strokeWidth={2.8} />
          </div>
          <span style={{ fontFamily: 'Playfair Display, serif', fontWeight: 700, fontSize: 16, color: theme.text }}>Checklist</span>
        </div>
        {activeList && (
          <span style={{ fontSize: 13, color: theme.textSoft, fontStyle: 'italic' }}>{activeList.title}</span>
        )}
      </div>

      {/* Content */}
      <div style={{ flex: 1, overflow: 'hidden' }}>
        {activeList ? (
          <DetailScreen list={activeList} theme={theme}
            onChange={handleUpdate} onBack={() => setActiveId(null)} />
        ) : (
          <HomeScreen lists={lists} theme={theme}
            onOpen={id => setActiveId(id)} onNew={() => setShowCreate(true)}
            onDelete={handleDelete} onRename={handleRename} onReorder={handleReorder} />
        )}
      </div>

      {showCreate && (
        <CreateModal theme={theme} onClose={() => setShowCreate(false)} onCreate={handleCreate} />
      )}

      {/* Floating theme button */}
      <button
        onClick={() => setTweaksVisible(v => !v)}
        title="Change theme"
        style={{
          position: 'fixed', bottom: 24, right: 24, zIndex: 201,
          width: 44, height: 44, borderRadius: '50%',
          background: tweaksVisible ? theme.accent : theme.surface,
          border: `1.5px solid ${tweaksVisible ? theme.accent : theme.borderStrong}`,
          boxShadow: `0 4px 16px ${theme.shadowMd}`,
          color: tweaksVisible ? '#fff' : theme.textMid,
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          transition: 'all 0.2s',
        }}
        onMouseEnter={e => { if (!tweaksVisible) { e.currentTarget.style.background = theme.accentSoft; e.currentTarget.style.color = theme.accent; } }}
        onMouseLeave={e => { if (!tweaksVisible) { e.currentTarget.style.background = theme.surface; e.currentTarget.style.color = theme.textMid; } }}
      >
        <Icon name="palette" size={18} />
      </button>

      <TweaksPanel visible={tweaksVisible} themeKey={themeKey} onTheme={handleThemeChange} />

      <style>{`
        ::-webkit-scrollbar-thumb { background: ${theme.scrollThumb}; }
        input[type="date"]::-webkit-calendar-picker-indicator { opacity: 0.5; cursor: pointer; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
